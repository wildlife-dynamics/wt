[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wt-runner-gcp"
dynamic = ["version"]
description = "Metapackage bundling wt-runner with GCP dependencies (Pub/Sub, tracing, Cloud Batch)"
requires-python = ">=3.13,<3.14"
license = { text = "BSD-3-Clause" }
classifiers = [
    "License :: OSI Approved :: BSD License",
]
dependencies = [
    "wt-runner>=0.1.0,<1.0.0",
    "ecoscope-eda-core @ git+https://github.com/wildlife-dynamics/ecoscope-eda-core.git",
    "opentelemetry-sdk>=1.37.0,<2",
    "opentelemetry-exporter-gcp-trace>=1.9.0,<2",
    "wt-invokers-gcp>=0.1.0,<1.0.0",
    # bundling ecoscope-eda-core dependencies, this can be removed following
    # fix for https://github.com/wildlife-dynamics/ecoscope-eda-core/issues/14
    "aiohttp>=3.11.18,<4",
    "pydantic>=2.0.0",
    "gcloud-aio-pubsub>=6.1.0,<7",
    "stamina>=25.1.0,<26",
]

[tool.uv.sources]
wt-runner = { path = "../wt-runner", editable = true }
wt-contracts = { path = "../wt-contracts", editable = true }
wt-invokers = { path = "../wt-invokers", editable = true }
wt-invokers-gcp = { path = "../wt-invokers-gcp", editable = true }

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
tag_regex = "^wt-runner-gcp/v(?P<version>[0-9.]+)$"
root = ".."
version_file = "src/wt_runner_gcp/_version.py"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "wt-runner-gcp/v*"]

[tool.ruff.lint]
extend-select = [
    # already-explicit families (kept; F dropped — it's a default)
    "E",       # pycodestyle errors (extends defaults E4/E7/E9 with E1/E2/E5)
    "W",       # pycodestyle warnings
    "I",       # isort
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "RUF",     # ruff-specific
    "PLC0415", # import-outside-top-level (mandatory per CLAUDE.md)

    # CLAUDE.md mandates, now enforced
    "ANN",     # flake8-annotations (require complete type annotations)
    "D",       # pydocstyle (require docstrings on public API)

    # high-value / low-noise modernizers
    "SIM",     # flake8-simplify
    "RET",     # flake8-return
    "PIE",     # flake8-pie
    "PTH",     # flake8-use-pathlib
    "ICN",     # flake8-import-conventions
    "TID",     # flake8-tidy-imports
    "TC",      # flake8-type-checking
    "ISC",     # flake8-implicit-str-concat
    "YTT",     # flake8-2020
    "PERF",    # Perflint
    "FURB",    # refurb
    "LOG",     # flake8-logging
    "G",       # flake8-logging-format
    "PT",      # flake8-pytest-style
    "ASYNC",   # flake8-async

    # security / strictness (require per-file-ignores)
    "S",       # flake8-bandit
    "ARG",     # flake8-unused-arguments
    "BLE",     # flake8-blind-except
    "PLE",     # Pylint errors
    "PLW",     # Pylint warnings
]
ignore = [
    "E501",   # line length — handled by formatter
    "ISC001", # conflicts with formatter (ruff docs recommend disabling)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]                       # re-exports + missing module docstring
"tests/**/*.py" = ["D", "S101", "ANN", "ARG", "PT011"] # tests don't need docstrings/annotations; assert OK

# ============================================================================
# Pixi Build Configuration (conda package building)
# ============================================================================

[tool.pixi.package]
name = "wt-runner-gcp"
version = "0.1.5"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*", channels = ["conda-forge", "https://prefix.dev/pixi-build-backends"] }

[tool.pixi.package.build.config]
noarch = true

[tool.pixi.package.host-dependencies]
python = ">=3.13,<3.14"
setuptools = ">=64"
setuptools-scm = ">=8"
pip = "*"

[tool.pixi.package.run-dependencies]
python = ">=3.13,<3.14"
wt-runner = ">=0.1.0,<1.0.0"
ecoscope-eda-core = ">=0.2.0"
opentelemetry-sdk = ">=1.37.0,<2"
opentelemetry-exporter-gcp-trace = ">=1.9.0,<2"
wt-invokers-gcp = ">=0.1.0,<1.0.0"
# bundling ecoscope-eda-core dependencies, this can be removed following
# fix for https://github.com/wildlife-dynamics/ecoscope-eda-core/issues/14
aiohttp = ">=3.11.18,<4"
pydantic = ">=2.0.0"
gcloud-aio-pubsub = ">=6.1.0,<7"
stamina = ">=25.1.0,<26"
