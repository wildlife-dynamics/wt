# Reverse Integration Test Manifest
# Lists downstream repos to test against the latest wt-compiler

repos:
  - url: https://github.com/ecoscope-platform-workflows-releases/event-details
    ref: main  # Default: main branch
    spec_path: spec.yaml  # Default: spec.yaml at repo root
    generated_path: ecoscope-workflows-event-details-workflow
    compile_flags:
      pkg_name_prefix: ecoscope-workflows
      results_env_var: ECOSCOPE_WORKFLOWS_RESULTS
      variant: gcp

  - url: https://github.com/ecoscope-platform-workflows-releases/events
    ref: main  # Default: main branch
    spec_path: spec.yaml  # Default: spec.yaml at repo root
    generated_path: ecoscope-workflows-events-workflow
    compile_flags:
      pkg_name_prefix: ecoscope-workflows
      results_env_var: ECOSCOPE_WORKFLOWS_RESULTS
      variant: gcp

  - url: https://github.com/ecoscope-platform-workflows-releases/patrols
    ref: main  # Default: main branch
    spec_path: spec.yaml  # Default: spec.yaml at repo root
    generated_path: ecoscope-workflows-patrols-workflow
    compile_flags:
      pkg_name_prefix: ecoscope-workflows
      results_env_var: ECOSCOPE_WORKFLOWS_RESULTS
      variant: gcp

  - url: https://github.com/ecoscope-platform-workflows-releases/subject-tracking
    ref: main  # Default: main branch
    spec_path: spec.yaml  # Default: spec.yaml at repo root
    generated_path: ecoscope-workflows-subject-tracking-workflow
    compile_flags:
      pkg_name_prefix: ecoscope-workflows
      results_env_var: ECOSCOPE_WORKFLOWS_RESULTS
      variant: gcp

  # Example with custom ref and spec path:
  # - url: https://github.com/example/custom-workflow
  #   ref: v2.0.0
  #   spec_path: config/spec.yaml
  #   generated_path: my-workflow-package
  #   compile_flags:
  #     pkg_name_prefix: my-prefix
  #     results_env_var: MY_RESULTS
  #     variant: gcp

  # Example with multiple specs in a monorepo:
  # - url: https://github.com/example/workflows-monorepo
  #   specs:
  #     - spec_path: workflows/etl/spec.yaml
  #       generated_path: workflows/etl/wf-etl-workflow
  #       compile_flags:
  #         pkg_name_prefix: wf
  #     - spec_path: workflows/reports/spec.yaml
  #       generated_path: workflows/reports/wf-reports-workflow

# Files allowed to have diffs after recompilation.
# Simple string entries allow any change. Conditional entries with
# allowed_variance only permit changes in regions matching the patterns.
# Use single-quoted strings for regex patterns (no escaping needed).
# See README.md for details.
diff_allowlist:
  - README.md
  - pixi.lock
  - graph.png

  # Only the MIN version field may change
  - file: VERSION.yaml
    allowed_variance:
      - 'MIN: \d+'

  # Only the PIXI_VERSION value may change
  - file: Dockerfile
    allowed_variance:
      - 'PIXI_VERSION=\S+'
