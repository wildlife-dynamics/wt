# Reverse Integration Test Manifest
# Lists downstream repos to test against the latest wt-compiler.
#
# Each repo entry merges in one of two shared blocks via YAML merge keys
# (``<<: *anchor``) and only declares its own identifying fields
# (``url``, ``ref``, ``spec_path``, ``generated_path``). The two groups:
#
#   * ``*compile_only`` — runs ``test_recompile.py`` against a strict
#     conditional allowlist for ``pixi.toml`` (only the regex region
#     matching ``version = "..."`` may differ).
#   * ``*env_overrides`` — passes the ``env_overrides`` compile flag, which
#     causes ``wt-compiler`` to inject path-source declarations for every
#     ``wt-*`` package. The resulting ``pixi.toml`` differs in ways too
#     large to launder through the per-line variance check, so those items
#     allow ``pixi.toml`` to change at the file level and additionally
#     run ``test_generated.py``.
#
# The ``:env-overrides`` suffix on the manifest item ID is appended
# automatically by ``RepoConfig.id`` whenever ``compile_flags.env_overrides``
# is set.
#
# Top-level keys other than ``repos`` (the two anchor definitions below)
# are inert: ``conftest.get_repo_configs`` only iterates ``manifest["repos"]``.

# Compile-only: stock wt-compiler invocation. ``pixi.toml`` is held to a
# single-regex allowlist so any unexpected drift fails the test.
_compile_only: &compile_only
  compile_flags:
    pkg_name_prefix: ecoscope-workflows
    results_env_var: ECOSCOPE_WORKFLOWS_RESULTS
    variant: gcp
    # diff vs *env_overrides: no ``env_overrides`` key
  tests: [recompile]  # diff vs *env_overrides: no ``generated``
  diff_allowlist:
    - README.md
    - pixi.lock
    - graph.png
    - file: VERSION.yaml
      allowed_variance:
        - 'MIN: \d+'
    - file: Dockerfile
      allowed_variance:
        - 'PIXI_VERSION=\S+'
    # diff vs *env_overrides: ``pixi.toml`` is conditional (single regex),
    # not an unconditional file-level allow.
    - file: pixi.toml
      allowed_variance:
        - '(?<=version = ")[^"]*'

# Env-overrides: exercises wt-compiler's path-source injection codepath.
# The injected blocks change ``pixi.toml`` in ways too large to launder
# through line-by-line variance, so ``pixi.toml`` is allowed at the file
# level, and the generated test suite additionally runs.
_env_overrides: &env_overrides
  compile_flags:
    pkg_name_prefix: ecoscope-workflows
    results_env_var: ECOSCOPE_WORKFLOWS_RESULTS
    variant: gcp
    env_overrides: wt-compiler-env-overrides.toml  # diff vs *compile_only
  tests: [recompile, generated]  # diff vs *compile_only: adds ``generated``
  diff_allowlist:
    - README.md
    - pixi.lock
    - graph.png
    # diff vs *compile_only: ``pixi.toml`` is unconditional (file-level allow),
    # not regex-restricted.
    - pixi.toml
    - file: VERSION.yaml
      allowed_variance:
        - 'MIN: \d+'
    - file: Dockerfile
      allowed_variance:
        - 'PIXI_VERSION=\S+'

