[project]
name = "wt-reverse-integration"
version = "0.1.0"
description = "Reverse integration tests for the wt (Workflow Template) framework"
requires-python = ">=3.10"

dependencies = [
    "pytest>=8.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "wt-compiler",
]

[tool.uv.sources]
# Use local wt-compiler package (relative to tests/reverse_integration/)
wt-compiler = { path = "../../wt-compiler", editable = true }

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["test_*.py"]
addopts = "-v"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helpers"]
