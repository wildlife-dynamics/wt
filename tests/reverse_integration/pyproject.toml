[project]
name = "wt-reverse-integration"
version = "0.1.0"
description = "Reverse integration tests for the wt (Workflow Template) framework"
requires-python = ">=3.12"

dependencies = [
    "pytest>=8.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "wt-compiler",
]

[tool.uv.sources]
# Use local wt-compiler package (relative to tests/reverse_integration/)
wt-compiler = { path = "../../wt-compiler", editable = true }

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["test_*.py"]
addopts = "-v"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
extend-select = [
    # already-explicit families (kept; F dropped — it's a default)
    "E",       # pycodestyle errors (extends defaults E4/E7/E9 with E1/E2/E5)
    "W",       # pycodestyle warnings
    "I",       # isort
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "RUF",     # ruff-specific
    "PLC0415", # import-outside-top-level (mandatory per CLAUDE.md)

    # CLAUDE.md mandates, now enforced
    "ANN",     # flake8-annotations (require complete type annotations)
    "D",       # pydocstyle (require docstrings on public API)

    # high-value / low-noise modernizers
    "SIM",     # flake8-simplify
    "RET",     # flake8-return
    "PIE",     # flake8-pie
    "PTH",     # flake8-use-pathlib
    "ICN",     # flake8-import-conventions
    "TID",     # flake8-tidy-imports
    "TC",      # flake8-type-checking
    "ISC",     # flake8-implicit-str-concat
    "YTT",     # flake8-2020
    "PERF",    # Perflint
    "FURB",    # refurb
    "LOG",     # flake8-logging
    "G",       # flake8-logging-format
    "PT",      # flake8-pytest-style
    "ASYNC",   # flake8-async

    # security / strictness (require per-file-ignores)
    "S",       # flake8-bandit
    "ARG",     # flake8-unused-arguments
    "BLE",     # flake8-blind-except
    "PLE",     # Pylint errors
    "PLW",     # Pylint warnings
]
ignore = [
    "E501",   # line length — handled by formatter
    "ISC001", # conflicts with formatter (ruff docs recommend disabling)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]                       # re-exports + missing module docstring
"tests/**/*.py" = ["D", "S101", "ANN", "ARG", "PT011"] # tests don't need docstrings/annotations; assert OK
# This whole package is test/integration infrastructure (tests live under src/,
# helpers shell out to git/pixi). Apply the test exemptions plus subprocess-call
# exemptions across src/, since shelling out is the point of these tests.
"src/**/*.py" = [
    "D", "S101", "ANN", "ARG", "PT011",
    "S603", "S607", "S310", "PLW1510",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helpers"]
