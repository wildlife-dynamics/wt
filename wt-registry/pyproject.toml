[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wt-registry"
dynamic = ["version"]
description = "Explicit function registry with JSON schema generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Charles Stern", email = "charles@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "wt-contracts>=0.1.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.scripts]
wt-registry = "wt_registry.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
]

[tool.uv.sources]
# Development override - uses local editable wt-contracts
# Published packages will reference PyPI version normally
wt-contracts = { path = "../wt-contracts", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Version comes from git tags matching this pattern
tag_regex = "^wt-registry/v(?P<version>[0-9.]+)$"
# Root is the git repository root (parent of wt/)
root = ".."
# Generate version file
version_file = "src/wt_registry/_version.py"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "wt-registry/v*"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/wt_registry"]
python_files = ["test_*.py"]
addopts = "--doctest-modules --doctest-continue-on-failure --cov=wt_registry --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/wt_registry"]
omit = ["*/tests/*", "*/_version.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
extend-select = [
    # already-explicit families (kept; F dropped — it's a default)
    "E",       # pycodestyle errors (extends defaults E4/E7/E9 with E1/E2/E5)
    "W",       # pycodestyle warnings
    "I",       # isort
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "RUF",     # ruff-specific
    "PLC0415", # import-outside-top-level (mandatory per CLAUDE.md)

    # CLAUDE.md mandates, now enforced
    "ANN",     # flake8-annotations (require complete type annotations)
    "D",       # pydocstyle (require docstrings on public API)

    # high-value / low-noise modernizers
    "SIM",     # flake8-simplify
    "RET",     # flake8-return
    "PIE",     # flake8-pie
    "PTH",     # flake8-use-pathlib
    "ICN",     # flake8-import-conventions
    "TID",     # flake8-tidy-imports
    "TC",      # flake8-type-checking
    "ISC",     # flake8-implicit-str-concat
    "YTT",     # flake8-2020
    "PERF",    # Perflint
    "FURB",    # refurb
    "LOG",     # flake8-logging
    "G",       # flake8-logging-format
    "PT",      # flake8-pytest-style
    "ASYNC",   # flake8-async

    # security / strictness (require per-file-ignores)
    "S",       # flake8-bandit
    "ARG",     # flake8-unused-arguments
    "BLE",     # flake8-blind-except
    "PLE",     # Pylint errors
    "PLW",     # Pylint warnings
]
ignore = [
    "E501",   # line length — handled by formatter
    "ISC001", # conflicts with formatter (ruff docs recommend disabling)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]                       # re-exports + missing module docstring
"tests/**/*.py" = ["D", "S101", "ANN", "ARG", "PT011"] # tests don't need docstrings/annotations; assert OK
"examples/**/*.py" = ["ARG", "ANN"]                    # demo code: unused args + light annotations are intentional
# Allow long lines in doctests showing exception messages
"src/wt_registry/exceptions.py" = ["E501"]
"src/wt_registry/registry.py" = ["E501", "D301"] # to_json doctest needs `\n` (newline) — must not be raw

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
files = ["src/wt_registry"]

# ============================================================================
# Pixi Build Configuration (conda package building)
# ============================================================================

[tool.pixi.package]
name = "wt-registry"
version = "0.2.1"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*", channels = ["conda-forge", "https://prefix.dev/pixi-build-backends"] }

[tool.pixi.package.build.config]
noarch = true

[tool.pixi.package.host-dependencies]
python = ">=3.10,<3.16"
setuptools = ">=64"
setuptools-scm = ">=8"
pip = "*"

[tool.pixi.package.run-dependencies]
python = ">=3.10,<3.16"
pydantic = ">=2.0.0,<3.0.0"
wt-contracts = ">=0.1.0,<1.0.0"
