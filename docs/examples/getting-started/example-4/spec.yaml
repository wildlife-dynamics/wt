id: add_then_split

requirements:
  - name: custom-tasks
    path: /absolute/path/to/custom-tasks

workflow:
  - id: total
    name: "Add Two Numbers"
    task: custom_tasks.tasks.add
    partial:
      a: 4
      b: 8

  - id: digits
    name: "Split Into Digits"
    task: custom_tasks.tasks.split_digits
    partial:
      n: ${{ workflow.total.return }}
