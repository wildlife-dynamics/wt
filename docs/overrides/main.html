{

    "react": "https://esm.sh/react@18.3.1",
    "react/": "https://esm.sh/react@18.3.1/",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "@rjsf/core": "https://esm.sh/@rjsf/core@5.24.7?external=react,react-dom",
    "@rjsf/utils": "https://esm.sh/@rjsf/utils@5.24.7?external=react,react-dom",
    "@rjsf/validator-ajv8": "https://esm.sh/@rjsf/validator-ajv8@5.24.7?external=react,react-dom"
