name: Publish to PyPI & Conda

on:
  push:
    tags:
      - "*/v*"
  workflow_dispatch: {}

jobs:
  # ============================================================================
  # Tag-triggered jobs (push only)
  # ============================================================================

  parse:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PACKAGE="${TAG%%/v*}"
          VERSION="${TAG#*/v}"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate package
        run: |
          KNOWN_PACKAGES="wt-contracts wt-registry wt-task wt-compiler wt-invokers wt-runner wt-task-gcp wt-invokers-gcp wt-runner-gcp"
          if ! echo "$KNOWN_PACKAGES" | grep -qw "${{ steps.parse.outputs.package }}"; then
            echo "::error::Unknown package: ${{ steps.parse.outputs.package }}"
            exit 1
          fi

  publish-prefix:
    needs: parse
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.63.0
          run-install: false

      - name: Install rattler-build & rattler-index
        run: |
          pixi global install rattler-build
          pixi global install rattler-index

      - name: Build conda package
        run: ./scripts/build-conda-packages.sh ${{ needs.parse.outputs.package }}

      - name: Upload to prefix.dev
        run: |
          rattler-build upload prefix \
            -c ecoscope-workflows \
            /tmp/wt-conda-channel/noarch/${{ needs.parse.outputs.package }}-*.conda

      - name: Generate package-scoped release notes
        env:
          TAG: ${{ needs.parse.outputs.package }}/v${{ needs.parse.outputs.version }}
          PACKAGE: ${{ needs.parse.outputs.package }}
        run: |
          # Try to extract notes from annotated tag (skip the header line)
          annotation="$(git tag -l --format='%(contents)' "$TAG")"
          body="$(echo "$annotation" | tail -n +3)"

          if [ -n "$(echo "$body" | tr -d '[:space:]')" ]; then
            echo "$body" > /tmp/release-notes.md
          else
            # Fallback: generate notes from commits since previous tag
            prev_tag="$(git tag --list "${PACKAGE}/v*" --sort=-version:refname \
              | grep -v "^${TAG}$" | head -1)"
            if [ -n "$prev_tag" ]; then
              range="${prev_tag}..${TAG}"
            else
              range="$TAG"
            fi
            git log "$range" --oneline -- "${PACKAGE}/" \
              | sed 's/^[0-9a-f]* /- /' > /tmp/release-notes.md
            # If still empty, add a placeholder
            if [ ! -s /tmp/release-notes.md ]; then
              echo "Release ${PACKAGE} v${{ needs.parse.outputs.version }}" > /tmp/release-notes.md
            fi
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ needs.parse.outputs.package }} v${{ needs.parse.outputs.version }}"
          body_path: /tmp/release-notes.md

  publish-docker:
    needs: [parse, publish-prefix]
    if: github.event_name == 'push' && needs.parse.outputs.package == 'wt-invokers'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for prefix.dev propagation
        run: |
          for i in $(seq 1 12); do
            if pixi global install --dry-run \
              -c https://prefix.dev/ecoscope-workflows -c conda-forge \
              wt-invokers==${{ needs.parse.outputs.version }} 2>/dev/null; then
              echo "Package available on prefix.dev"
              exit 0
            fi
            echo "Attempt $i/12: package not yet available, waiting 10s..."
            sleep 10
          done
          echo "Package not available after 2 minutes"
          exit 1
      - name: Build image (load locally, don't push yet)
        uses: docker/build-push-action@v5
        with:
          context: wt-invokers/docker/sandbox
          platforms: linux/amd64
          load: true
          tags: ghcr.io/wildlife-dynamics/wt-invokers:sandbox-${{ needs.parse.outputs.version }}
      - name: Smoke test
        run: |
          docker run --rm ghcr.io/wildlife-dynamics/wt-invokers:sandbox-${{ needs.parse.outputs.version }} \
            --help
      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: wt-invokers/docker/sandbox
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/wildlife-dynamics/wt-invokers:sandbox-${{ needs.parse.outputs.version }}
            ghcr.io/wildlife-dynamics/wt-invokers:sandbox-latest

  publish-pypi:
    needs: [parse, publish-prefix]
    if: github.event_name == 'push' && !contains(needs.parse.outputs.package, '-gcp')
    runs-on: ubuntu-latest
    environment: release-${{ needs.parse.outputs.package }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build package
        working-directory: ${{ needs.parse.outputs.package }}
        run: uv build

      - name: Publish to PyPI
        working-directory: ${{ needs.parse.outputs.package }}
        run: uv publish

  # ============================================================================
  # Manual sync job (workflow_dispatch only)
  # ============================================================================

  sync:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.63.0
          run-install: false

      - name: Install rattler-build
        run: pixi global install rattler-build

      - name: Sync all packages to registries
        run: bash scripts/sync-registries.sh
