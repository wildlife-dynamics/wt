name: Publish to PyPI

on:
  push:
    tags:
      - "*/v*"

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.parse.outputs.package }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PACKAGE="${TAG%%/v*}"
          VERSION="${TAG#*/v}"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate package
        run: |
          KNOWN_PACKAGES="wt-contracts wt-registry wt-task wt-compiler wt-invokers wt-runner wt-task-gcp wt-invokers-gcp wt-runner-gcp"
          if ! echo "$KNOWN_PACKAGES" | grep -qw "${{ steps.parse.outputs.package }}"; then
            echo "::error::Unknown package: ${{ steps.parse.outputs.package }}"
            exit 1
          fi

  publish:
    needs: parse
    runs-on: ubuntu-latest
    environment: release-${{ needs.parse.outputs.package }}
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build package
        working-directory: ${{ needs.parse.outputs.package }}
        run: uv build

      - name: Publish to PyPI
        working-directory: ${{ needs.parse.outputs.package }}
        run: uv publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ needs.parse.outputs.package }} v${{ needs.parse.outputs.version }}"
          generate_release_notes: true
