name: Reverse Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [labeled, synchronize]

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check if tests should run
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Triggered by push to main"
            echo "should_run=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # Check for the trigger label
            if [[ "${{ contains(github.event.pull_request.labels.*.name, 'run-reverse-integration') }}" == "true" ]]; then
              echo "Triggered by label on PR"
              echo "should_run=true" >> $GITHUB_OUTPUT
            else
              echo "PR does not have run-reverse-integration label"
              echo "should_run=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  reverse-integration:
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [main, latest-release]
    defaults:
      run:
        working-directory: tests/reverse_integration
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.39.0

      - name: Install Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run reverse-integration tests (recompilation only)
        run: |
          if [[ "${{ matrix.ref }}" == "latest-release" ]]; then
            uv run pytest src/test_recompile.py -v --repo-ref=latest-release
          else
            uv run pytest src/test_recompile.py -v
          fi

      - name: Run reverse-integration tests (generated tests)
        run: |
          if [[ "${{ matrix.ref }}" == "latest-release" ]]; then
            uv run pytest src/test_generated.py -v --repo-ref=latest-release
          else
            uv run pytest src/test_generated.py -v
          fi

  # Summary job for branch protection
  reverse-integration-complete:
    runs-on: ubuntu-latest
    needs: [check-trigger, reverse-integration]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.check-trigger.outputs.should_run }}" == "false" ]]; then
            echo "Tests were skipped (no trigger label on PR)"
            exit 0
          elif [[ "${{ needs.reverse-integration.result }}" == "success" ]]; then
            echo "All reverse integration tests passed!"
            exit 0
          else
            echo "Reverse integration tests failed or were cancelled"
            exit 1
          fi
