name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - wt-contracts
          - wt-registry
          - wt-task
          - wt-compiler
          - wt-invokers
          - wt-runner
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        extras: [""]
        exclude:
          - package: wt-compiler
            python-version: "3.10"
          - package: wt-compiler
            python-version: "3.11"
          - package: wt-invokers
            python-version: "3.10"
          - package: wt-invokers
            python-version: "3.11"
          - package: wt-runner
            python-version: "3.10"
          - package: wt-runner
            python-version: "3.11"
          - package: wt-runner
            python-version: "3.12"
        include:
          # Additional runs WITH gcp extra
          - package: wt-runner
            python-version: "3.13"
            extras: "--extra gcp"
          - package: wt-task
            python-version: "3.13"
            extras: "--extra gcp"
          - package: wt-invokers
            python-version: "3.13"
            extras: "--extra gcp"
          - package: wt-runner-gcp
            python-version: "3.13"
            extras: ""

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so setuptools-scm can compute real versions
          # for local editable siblings (e.g. wt-invokers), which is required
          # when uv falls back to resolving from pyproject.toml rather than
          # installing from a committed lockfile.
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Check lockfile (and fail fast if it's stale)
        working-directory: ${{ matrix.package }}
        run: uv lock --check

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: uv sync ${{ matrix.extras }} --dev

      - name: Run ruff check
        if: matrix.package != 'wt-runner-gcp'
        working-directory: ${{ matrix.package }}
        run: uv run ruff check src/ tests/

      - name: Run ruff format check
        if: matrix.package != 'wt-runner-gcp'
        working-directory: ${{ matrix.package }}
        run: uv run ruff format --check src/ tests/

      - name: Run mypy
        if: matrix.package != 'wt-runner-gcp'
        working-directory: ${{ matrix.package }}
        run: uv run mypy src/

      - name: Run pytest
        working-directory: ${{ matrix.package }}
        run: uv run pytest

  dep-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check dependency sync
        run: python3 scripts/check-dep-sync.py

  test-reverse-integration-helpers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python
        run: uv python install 3.13

      - name: Install dependencies
        working-directory: tests/reverse_integration
        run: uv sync --dev

      - name: Run helper unit tests
        working-directory: tests/reverse_integration
        run: uv run pytest src/test_diff.py src/test_manifest.py -v
