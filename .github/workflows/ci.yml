name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - wt-contracts
          - wt-registry
          - wt-task
          - wt-compiler
          - wt-invokers
          - wt-runner
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        extras: [""]
        exclude:
          - package: wt-compiler
            python-version: "3.10"
          - package: wt-compiler
            python-version: "3.11"
          - package: wt-runner
            python-version: "3.10"
          - package: wt-runner
            python-version: "3.11"
          - package: wt-runner
            python-version: "3.12"
        include:
          # Additional runs WITH gcp extra
          - package: wt-runner
            python-version: "3.13"
            extras: "--extra gcp"
          - package: wt-task
            python-version: "3.13"
            extras: "--extra gcp"
          - package: wt-invokers
            python-version: "3.13"
            extras: "--extra gcp"
          - package: wt-runner-gcp
            python-version: "3.13"
            extras: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: uv sync ${{ matrix.extras }} --dev

      - name: Run ruff check
        working-directory: ${{ matrix.package }}
        run: uv run ruff check src/

      - name: Run ruff format check
        working-directory: ${{ matrix.package }}
        run: uv run ruff format --check src/

      - name: Run mypy
        working-directory: ${{ matrix.package }}
        run: uv run mypy src/

      - name: Run pytest
        working-directory: ${{ matrix.package }}
        run: uv run pytest

  dep-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check dependency sync
        run: python3 scripts/check-dep-sync.py
