[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wt-runner"
dynamic = ["version"]
description = "FastAPI application for workflow execution using wt-invokers"
requires-python = ">=3.10"
dependencies = [
    "wt-contracts>=0.1.0,<1.0.0",
    "wt-invokers>=0.1.0,<1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0,<3.0.0",
    "rattler>=0.8.0",
    "ruamel.yaml>=0.18.0",
    "opentelemetry-api>=1.0.0",
    "opentelemetry-sdk>=1.0.0",
]

[project.optional-dependencies]
# Storage dependencies
storage = [
    "obstore>=0.6.0",
]
# OpenTelemetry tracing dependencies
tracing = [
    "opentelemetry-sdk>=1.37.0,<2",
    "opentelemetry-exporter-gcp-trace>=1.9.0,<2",
]
# Google Cloud Platform dependencies
gcp = [
    "obstore>=0.6.0",
    "opentelemetry-sdk>=1.37.0,<2",
    "opentelemetry-exporter-gcp-trace>=1.9.0,<2",
    "gcloud-aio-pubsub>=6.1.0,<7",
]
# Additional workflow-related dependencies
workflows = [
    "ecoscope-eda-core @ git+https://github.com/wildlife-dynamics/ecoscope-eda-core.git",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.24.0",  # For FastAPI testing
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.uv.sources]
# Development override - uses local editable packages
# Published packages will reference PyPI version normally
wt-contracts = { path = "../wt-contracts", editable = true }
wt-invokers = { path = "../wt-invokers", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Version comes from git tags matching this pattern
tag_regex = "^wt-runner/v(?P<version>[0-9.]+)$"
# Root is the git repository root
root = ".."
# Generate version file
version_file = "src/wt_runner/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=wt_runner --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Depends",
]

# ============================================================================
# Pixi Build Configuration (conda package building)
# ============================================================================

[tool.pixi.package]
name = "wt-runner"
version = "0.1.0"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*", channels = ["conda-forge", "https://prefix.dev/pixi-build-backends"] }

[tool.pixi.package.build.config]
noarch = true

[tool.pixi.package.host-dependencies]
python = ">=3.10,<3.13"
setuptools = ">=64"
setuptools-scm = ">=8"
pip = "*"

[tool.pixi.package.run-dependencies]
python = ">=3.10,<3.13"
fastapi = ">=0.100.0"
uvicorn = ">=0.20.0"
pydantic = ">=2.0.0,<3.0.0"
rattler = ">=0.8.0"
ruamel-yaml = ">=0.18.0"
opentelemetry-api = ">=1.0.0"
opentelemetry-sdk = ">=1.0.0"
wt-contracts = ">=0.1.0,<1.0.0"
wt-invokers = ">=0.1.0,<1.0.0"
