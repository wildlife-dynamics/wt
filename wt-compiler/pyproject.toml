[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wt-compiler"
dynamic = ["version"]
description = "Workflow compiler for generating DAG artifacts from workflow specifications"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ecoscope Team" }
]
dependencies = [
    "wt-contracts>=0.1.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "jinja2>=3.0.0",
    "ruamel.yaml>=0.17.0",
    "py-rattler>=0.9.0",
    "datamodel-code-generator>=0.25.0",
    "pydot>=1.4.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "typing-extensions>=4.0.0; python_version < '3.11'",
]

[project.scripts]
wt-compiler = "wt_compiler.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Version comes from git tags matching this pattern
tag_regex = "^wt-compiler/v(?P<version>[0-9.]+)$"
# Root is the git repository root (parent of wt/)
root = ".."
# Generate version file
version_file = "src/wt_compiler/_version.py"

[tool.uv.sources]
# Development override - uses local editable wt-contracts
# Published packages will reference PyPI version normally
wt-contracts = { path = "../wt-contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=wt_compiler --cov-report=term-missing"
asyncio_mode = "auto"

[tool.mypy]
strict = true
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tomli"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
