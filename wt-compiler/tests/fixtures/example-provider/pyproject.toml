[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wt-example-provider"
version = "0.1.0"
description = "Example custom wizard provider — test fixture for wt-compiler"
requires-python = ">=3.12"
dependencies = ["wt-compiler"]

[project.entry-points."wt_compiler.wizard_providers"]
example = "wt_example_provider:ExampleProvider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wt_example_provider = ["templates/*"]

[tool.pixi.package]
name = "wt-example-provider"
version = "0.1.0"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*", channels = ["conda-forge", "https://prefix.dev/pixi-build-backends"] }

[tool.pixi.package.build.config]
noarch = true

[tool.pixi.package.host-dependencies]
python = ">=3.12,<3.16"
setuptools = ">=64"
pip = "*"

[tool.pixi.package.run-dependencies]
python = ">=3.12,<3.16"
wt-compiler = ">=0.1.0"
