# Simple test workflow specification
id: test-workflow
name: Test Workflow
description: A simple test workflow for unit testing

requirements:
  - ecoscope-workflows-core>=0.1.0
  - python>=3.10

channels:
  - conda-forge

workflow:
  - id: task1
    name: First Task
    task: test_module.add_numbers
    partial:
      x: 10
      y: 20

  - id: task2
    name: Second Task
    task: test_module.multiply
    partial:
      a: ${{ workflow.task1.return }}
      b: 2
