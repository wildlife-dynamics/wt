[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "wt-invokers"
dynamic = ["version"]
description = "Abstract invoker interface and implementations for wt workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Workflow Tools Contributors" }
]
keywords = ["workflow", "invoker", "execution", "subprocess", "cloud"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "wt-contracts>=0.1.0,<1.0.0",
    "py-rattler>=0.8.0",
    "ruamel.yaml>=0.17.0",
]

[project.optional-dependencies]
# GCP dependencies for CloudBatchInvoker
gcp = [
    "google-cloud-batch>=0.19.0",
    "google-auth>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Version comes from git tags matching this pattern
tag_regex = "^wt-invokers/v(?P<version>[0-9.]+)$"
# Root is the git repository root (monorepo)
root = ".."
# Generate version file
version_file = "src/wt_invokers/_version.py"
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "wt-invokers/v*"]

[tool.uv.sources]
# Development override - uses local editable wt-contracts
# Published packages will reference PyPI version normally
wt-contracts = { path = "../wt-contracts", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--doctest-modules --doctest-continue-on-failure --cov=wt_invokers --cov-report=term-missing"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "rattler",
    "rattler.*",
    "py_rattler",
    "py_rattler.*",
    "google.cloud.batch_v1",
    "google.cloud.batch_v1.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "wt_invokers.cloud_batch"
warn_unused_ignores = false

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused imports in __init__.py are okay
"tests/**/*.py" = ["S101"]  # Allow assert in tests

[tool.coverage.run]
source = ["wt_invokers"]
omit = [
    "*/tests/*",
    "*/_version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass",
]

# ============================================================================
# Pixi Build Configuration (conda package building)
# ============================================================================

[tool.pixi.package]
name = "wt-invokers"
version = "0.1.0"

[tool.pixi.package.build]
backend = { name = "pixi-build-python", version = "*", channels = ["conda-forge", "https://prefix.dev/pixi-build-backends"] }

[tool.pixi.package.build.config]
noarch = true

[tool.pixi.package.host-dependencies]
python = ">=3.10,<3.16"
setuptools = ">=64"
setuptools-scm = ">=8"
pip = "*"

[tool.pixi.package.run-dependencies]
python = ">=3.10,<3.16"
py-rattler = ">=0.8.0"
"ruamel.yaml" = ">=0.17.0"
wt-contracts = ">=0.1.0,<1.0.0"
